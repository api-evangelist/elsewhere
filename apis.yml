aid: elsewhere
name: Elsewhere
description: 'Elsewhere (Elsewhere Communities Inc.) is a San Francisco based video
  game studio founded in 2024 by Paul Sawaya, previously co-founder and CTO of Human
  Interest. The studio was part of cohort 001 of a16z SPEEDRUN, the Andreessen Horowitz
  accelerator for games and interactive media. Elsewhere describes itself as "a new
  kind of video game studio emboldened by the desire to rethink the industry", treating
  artificial intelligence as a normal technology and building games that use generative
  AI in a humanistic direction rather than a dystopian one. The studio previously worked
  on a multiplayer roguelike — games "that feel like an adventure you go on with your
  friends, and the adventure is never the same twice" — and is currently building something
  new. Elsewhere is a consumer game studio with no public developer platform: as of
  this enrichment pass it publishes no API, no developer portal, no SDKs, and no machine-readable
  discovery documents.'
